[metadata]
name = smgp
version = 1.0.0
author = Rohan R
author_email = rohan@smgp.dev
description = Spectral Memory Graph Processor
long_description = file: PACKAGE.md
long_description_content_type = text/markdown
license = Apache-2.0
url = https://github.com/rotsl/smgp
classifiers =
    Development Status :: 5 - Production/Stable
    Intended Audience :: Science/Research
    License :: OSI Approved :: Apache Software License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Topic :: Scientific/Engineering :: Artificial Intelligence

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
install_requires =
    numpy>=1.24.0
    scipy>=1.10.0
    networkx>=3.0
    click>=8.0
    pyyaml>=6.0

[options.packages.find]
where = src

[options.extras_require]
topology = gudhi>=3.8
integration = fastapi>=0.100.0; uvicorn>=0.23.0; httpx>=0.24.0
auth = python-jose[cryptography]>=3.3.0
huggingface = transformers>=4.30.0; torch>=2.0
langchain = langchain>=0.1.0
vectordb = qdrant-client>=1.7.0; sqlalchemy>=2.0
onnx = onnx>=1.14.0; torch>=2.0
hw =
all =
    smgp[topology]
    smgp[integration]
    smgp[auth]
    smgp[huggingface]
    smgp[langchain]
    smgp[vectordb]
    smgp[onnx]
dev =
    pytest>=7.4.0
    pytest-cov>=4.1.0
    pytest-anyio>=0.0.0
    anyio>=4.0.0
    hypothesis>=6.0.0
    ruff>=0.1.0
    black>=23.0
    mypy>=1.5.0
