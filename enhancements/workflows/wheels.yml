# SMGP Pre-Built Wheels — cibuildwheel
#
# Builds distribution wheels for SMGP across platforms and Python versions
# when a new version tag (v*) is pushed. Wheels are uploaded as artifacts
# and published to PyPI.
#
# This workflow uses cibuildwheel which supports:
#   - Pure Python wheels (the primary output for SMGP)
#   - Platform-specific wheels if C extensions are added in the future

name: Build and Publish Wheels

on:
  push:
    tags:
      - "v*"
  # Allow manual triggering for testing the wheel build process
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU (for Linux aarch64)
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.22
        env:
          # cibuildwheel build selection — Python 3.10, 3.11, 3.12
          CIBW_BUILD: "cp310-* cp311-* cp312-*"
          # Skip PyPy and development builds
          CIBW_SKIP: "pp* *-musllinux_*"
          # Test the wheel after building
          CIBW_TEST_COMMAND: "python -c \"import smgp; print(smgp.__version__)\""
          # Skip testing on some platforms where dependencies are hard to install
          CIBW_TEST_SKIP: "*-macosx_arm64 *-win32"
          # Build verbosity
          CIBW_BUILD_VERBOSITY: 1

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smgp-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl
          retention-days: 7

  # -------------------------------------------------------------------------
  # Publish to PyPI (only on tag push, not manual dispatch)
  # -------------------------------------------------------------------------
  publish-to-pypi:
    name: Publish to PyPI
    needs: build-wheels
    runs-on: ubuntu-latest
    # Only publish on tag pushes, not manual workflow dispatch
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/smgp
    permissions:
      id-token: write  # Required for Trusted Publishing

    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist/
          pattern: smgp-wheels-*
          merge-multiple: true

      - name: List built wheels
        run: ls -la ./dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ./dist/
          skip-existing: true

  # -------------------------------------------------------------------------
  # Build source distribution
  # -------------------------------------------------------------------------
  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build source distribution
        run: python -m build --sdist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: smgp-sdist
          path: ./dist/*.tar.gz
          retention-days: 7

  # Publish sdist to PyPI
  publish-sdist-to-pypi:
    name: Publish sdist to PyPI
    needs: build-sdist
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/smgp
    permissions:
      id-token: write

    steps:
      - name: Download sdist artifact
        uses: actions/download-artifact@v4
        with:
          name: smgp-sdist
          path: ./dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ./dist/
          skip-existing: true
