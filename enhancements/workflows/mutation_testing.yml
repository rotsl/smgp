# SMGP Mutation Testing Workflow
#
# Runs mutation testing on the smgp.core package using mutmut to evaluate
# the effectiveness of the test suite. Mutation testing systematically
# introduces code changes (mutants) and checks whether tests detect them.
#
# A mutation score below the threshold (80%) will fail this workflow.
#
# References:
#   DeMillo, R.A., et al. (1978). "Hints on Test Data Selection." IEEE Computer.

name: Mutation Testing

on:
  push:
    branches: [main]
    paths:
      - "src/smgp/core/**"
      - "tests/**"
  pull_request:
    branches: [main]
    paths:
      - "src/smgp/core/**"
      - "tests/**"
  # Allow manual triggering for ad-hoc mutation analysis
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation-testing:
    name: Run mutation tests (mutmut)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install smgp with dev dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"

      - name: Install mutmut
        run: pip install mutmut

      - name: Run mutation testing on smgp.core
        run: |
          mutmut run \
            --paths-to-mutate=src/smgp/core/ \
            --tests-dir=tests/ \
            --runner="pytest tests/ -x -q --tb=short" \
            --no-backup

      - name: Generate mutation report
        if: always()
        run: |
          mutmut results

      - name: Check mutation score threshold
        if: always()
        run: |
          SCORE=$(mutmut show | python3 -c "
          import sys, re
          text = sys.stdin.read()
          match = re.search(r'(\d+(?:\.\d+)?)%?\s*(?:killed|score)', text)
          print(match.group(1) if match else '0')
          ")
          echo "Mutation score: ${SCORE}%"
          # Fail if mutation score is below threshold
          python3 -c "
          score = float('${SCORE}')
          threshold = 80.0
          if score < threshold:
              print(f'Mutation score {score}% is below threshold {threshold}%')
              exit(1)
          print(f'Mutation score {score}% meets threshold {threshold}%')
          "

      - name: Upload mutation results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-testing-results
          path: |
            .mutmut-cache/
            mutation_report.txt
          retention-days: 30

  mutation-testing-cosmic-ray:
    name: Run mutation tests (cosmic-ray)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Run as a secondary check; mutations don't block the main workflow
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install smgp with dev dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"

      - name: Install cosmic-ray
        run: pip install cosmic-ray

      - name: Run cosmic-ray mutation testing
        run: |
          cosmic-ray init enhancements/mutation_config.toml session.cr
          cosmic-ray execute session.cr
          cosmic-ray report format session.cr

      - name: Upload cosmic-ray results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cosmic-ray-results
          path: |
            session.cr/
          retention-days: 30
