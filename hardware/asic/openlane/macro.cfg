# ===========================================================================
# Macro Placement Configuration for SMGP ASIC
# ===========================================================================
# Defines the placement and orientation of hardened macros on the die.
#
# Macros:
#   - hbm_ctrl_0: HBM memory controller (if hardening HBM interface)
#   - crossbar_0: Memristor crossbar analog block (placeholder)
#
# Coordinates are in microns, relative to the die origin (lower-left).
# Orientations: N (normal), S (180°), FN (mirror-x), FS (mirror-y), etc.
# ===========================================================================

# ---------------------------------------------------------------------------
# HBM Controller — placed in the upper-left quadrant
# ---------------------------------------------------------------------------
# For SkyWater 130nm, this would be a synthesized block, not a hardened macro.
# This entry serves as a placeholder for future integration with HBM PHY.
#
# Format: InstanceName  Width  Height  X  Y  Orientation
# ---------------------------------------------------------------------------
# hbm_ctrl_0  400  600  50  1000  N

# ---------------------------------------------------------------------------
# Memristor Crossbar — placed in the lower-right quadrant
# ---------------------------------------------------------------------------
# The analog crossbar array would be a custom macro.  For digital synthesis
# in OpenLane, we create a wrapper module that exposes digital I/O.
#
# crossbar_0  300  300  1600  50  FN

# ---------------------------------------------------------------------------
# Notes
# ---------------------------------------------------------------------------
# When actual macro LEF/GDS are available, uncomment the entries above and
# ensure the LEF files are listed in config.tcl under EXTRA_LEFS.
#
# Macro floorplanning strategy:
#   - HBM controller on the left edge (close to memory I/O pads)
#   - Crossbar on the right edge (close to analog I/O pads)
#   - Core digital logic in the center
#   - Standard cell rows oriented horizontally
# ===========================================================================
